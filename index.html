<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для тебя ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <button class="gift" id="gift" aria-label="Открыть подарок">
      <span class="gift__box">
        <span class="gift__lid"></span>
        <span class="gift__body"></span>
        <span class="gift__ribbon-v"></span>
        <span class="gift__ribbon-h"></span>
        <span class="gift__bow bow-left"></span>
        <span class="gift__bow bow-right"></span>
        <span class="gift__knot"></span>
      </span>
      <span class="gift__sparkle sparkle-1">✦</span>
      <span class="gift__sparkle sparkle-2">✦</span>
      <span class="gift__sparkle sparkle-3">✧</span>
    </button>

    <section class="love" id="love" aria-hidden="true">
      <div class="heart-wrap">
        <div class="heart">❤</div>
        <div class="shine">✦</div>
      </div>
      <h1>Я тебя люблю</h1>
      <p>❤️</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
